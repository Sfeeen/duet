<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --bg:#f6f7f8; --panel:#fff; --ink:#1b1d1f; --dim:#6a7179; --line:#e2e5e8;
    --you:#0a6e73; --you-bg:#e6f2f2; --bot-bg:#fff; --warn:#9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#141618; --panel:#1c1f22; --ink:#e8eaec; --dim:#969ca3; --line:#2b3035;
      --you:#4fc3c8; --you-bg:#16302f; --bot-bg:#1c1f22; --warn:#e0a24a;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); display:flex;
         flex-direction:column;
         font:15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background:var(--panel); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; gap:12px; align-items:center;
           flex-wrap:wrap; }
  select, button, textarea, input { font:inherit; color:inherit; }
  select, input[type=text] { background:var(--bg); color:var(--ink);
           border:1px solid var(--line); border-radius:7px; padding:6px 9px; }
  button { background:var(--you); color:#fff; border:0; border-radius:7px;
           padding:7px 15px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--dim);
                 border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .grow { flex:1; }
  .sys { width:100%; display:flex; gap:8px; align-items:center; }
  .sys input { flex:1; }
  main { flex:1; overflow-y:auto; padding:20px 16px 8px; }
  .wrap { max-width:820px; margin:0 auto; }
  .msg { margin:0 0 16px; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:86%; border:1px solid var(--line); border-radius:11px;
            padding:9px 13px; background:var(--bot-bg); white-space:pre-wrap;
            overflow-wrap:anywhere; }
  .msg.user .bubble { background:var(--you-bg); border-color:transparent; }
  .msg.err .bubble { color:var(--warn); border-color:var(--warn); }
  .who { font-size:11px; letter-spacing:.07em; text-transform:uppercase;
         color:var(--dim); margin-bottom:3px; }
  .think { opacity:.55; font-style:italic; }
  footer { background:var(--panel); border-top:1px solid var(--line); padding:10px 16px; }
  .composer { max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
  textarea { flex:1; resize:none; background:var(--bg); border:1px solid var(--line);
             border-radius:9px; padding:9px 11px; min-height:44px; max-height:210px; }
  .hint { max-width:820px; margin:6px auto 0; color:var(--dim); font-size:11.5px; }
</style>
</head>
<body>
<header>
  <strong>Chat</strong>
  <select id="model" title="model"></select>
  <span class="grow"></span>
  <button class="ghost" id="reset">New chat</button>
  <div class="sys">
    <span style="color:var(--dim);font-size:12px">system</span>
    <input type="text" id="system" placeholder="optional system prompt — applies to a new chat">
  </div>
</header>

<main id="main"><div class="wrap" id="chat"></div></main>

<footer>
  <div class="composer">
    <textarea id="box" placeholder="Message…  (Enter sends, Shift+Enter newline)"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint" id="hint"></div>
</footer>

<script>
const $ = id => document.getElementById(id);
let history = [], busy = false;

function bubble(role, text, cls) {
  const row = document.createElement('div');
  row.className = 'msg ' + (role === 'user' ? 'user' : 'bot') + (cls ? ' ' + cls : '');
  const b = document.createElement('div');
  b.className = 'bubble';
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? 'you' : ($('model').value || 'model');
  const body = document.createElement('div');
  body.textContent = text;
  b.appendChild(who); b.appendChild(body); row.appendChild(b);
  $('chat').appendChild(row);
  $('main').scrollTop = $('main').scrollHeight;
  return body;
}

async function loadModels() {
  try {
    const list = await (await fetch('/models')).json();
    if (list.error) throw new Error(list.error);
    const sel = $('model');
    sel.innerHTML = '';
    for (const m of list) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.id + (m.state === 'loaded' ? '  ● loaded' : '');
      sel.appendChild(o);
    }
    const loaded = list.find(m => m.state === 'loaded');
    if (loaded) sel.value = loaded.id;
    $('hint').textContent = list.length + ' model(s) on the endpoint. ' +
      'Picking one that is not loaded makes the host load it first — that can take a minute.';
  } catch (e) {
    $('hint').textContent = 'cannot list models: ' + e.message;
  }
}

async function send() {
  const text = $('box').value.trim();
  if (!text || busy) return;
  $('box').value = '';
  $('box').style.height = 'auto';
  bubble('user', text);
  history.push({role: 'user', content: text});

  busy = true; $('send').disabled = true;
  const out = bubble('assistant', '');
  const msgs = history.slice();
  const sys = $('system').value.trim();
  if (sys) msgs.unshift({role: 'system', content: sys});

  try {
    const r = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: $('model').value, messages: msgs})
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({error: 'HTTP ' + r.status}));
      throw new Error(e.error || ('HTTP ' + r.status));
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', full = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim();
        if (d === '[DONE]') continue;
        try {
          const piece = JSON.parse(d).choices[0].delta.content || '';
          full += piece;
          out.textContent = full;
          $('main').scrollTop = $('main').scrollHeight;
        } catch (_) {}
      }
    }
    if (full.trim()) history.push({role: 'assistant', content: full});
    else { out.parentElement.parentElement.className = 'msg err';
           out.textContent = '(the model returned nothing)'; history.pop(); }
  } catch (e) {
    out.parentElement.parentElement.className = 'msg err';
    out.textContent = e.message;
    history.pop();
  }
  busy = false; $('send').disabled = false; $('box').focus();
}

$('send').onclick = send;
$('reset').onclick = () => { history = []; $('chat').innerHTML = ''; $('box').focus(); };
$('box').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('box').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 210) + 'px';
});
loadModels();
$('box').focus();
</script>
</body>
</html>
